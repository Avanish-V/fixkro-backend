spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    
  application:
    name: zippyhand-Admin
  main:
    lazy-initialization: true
    banner-mode: off

  jpa:
    # Use environment specific configurations (application-dev.yaml or application-prod.yaml) for ddl-auto
    show-sql: false 
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false # Stop blocking startup waiting for Kafka
    properties:
      request.timeout.ms: 5000 # Shorten the timeout
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: zippyhand-admin-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

# Pricing configuration
zippyhand:
  pricing:
    tax-rate: 0.0
    currency: INR
    offers-enabled: true

